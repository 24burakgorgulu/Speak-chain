<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Speak Chain</title>
<meta name="description" content="Sesli İngilizce konuşma pratiği, hata analizi ve zinciri kırma takibi.">
<meta name="theme-color" content="#142033">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Speak Chain">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: one working column; the chain is the hero, modes below, then error book + history side by side */
:root{
  --bg:#F2F4F7; --surface:#FFFFFF; --sunk:#E8ECF1; --ink:#142033; --muted:#5A6576; --line:#D9DFE7;
  --brass:#A87526; --brass-2:#D9A84C; --teal:#12756C; --danger:#B4473C; --ok:#2C7A4C;
  --err-bg:rgba(180,71,60,.14); --up-bg:rgba(168,117,38,.18);
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, "SFMono-Regular", Consolas, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1420; --surface:#161E2B; --sunk:#1D2636; --ink:#E5EAF1; --muted:#98A3B4; --line:#273244;
  --brass:#D6A246; --brass-2:#F0CB78; --teal:#3BB2A5; --danger:#E27C70; --ok:#5DBA88;
  --err-bg:rgba(226,124,112,.18); --up-bg:rgba(214,162,70,.2); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1420; --surface:#161E2B; --sunk:#1D2636; --ink:#E5EAF1; --muted:#98A3B4; --line:#273244;
  --brass:#D6A246; --brass-2:#F0CB78; --teal:#3BB2A5; --danger:#E27C70; --ok:#5DBA88;
  --err-bg:rgba(226,124,112,.18); --up-bg:rgba(214,162,70,.2); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.55 var(--f-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.wrap{max-width:1080px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.15}
h2{font-size:1.35rem;font-weight:700}
h3{font-size:1.05rem;font-weight:700}
p{margin:0}
.muted{color:var(--muted)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.eyebrow{font:600 .72rem/1 var(--f-mono);letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--teal);outline-offset:2px}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px}
.brand h1{font-size:1.6rem;font-weight:800;letter-spacing:-.01em}
.brand svg{flex:none}
.nav{display:flex;gap:6px;flex-wrap:wrap}
.nav button{background:transparent;border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:.88rem}
.nav button[aria-current="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.note{font-size:.85rem;color:var(--muted);background:var(--sunk);border-radius:10px;padding:10px 14px}
.note.warn{color:var(--danger)}

/* panels */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 16px;font-weight:500}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--teal);border-color:var(--teal);color:#fff}
.btn.primary:hover{filter:brightness(1.07)}
.btn.brass{background:var(--brass);border-color:var(--brass);color:#fff}
.btn.danger{color:var(--danger)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.small{padding:5px 11px;font-size:.84rem}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* chain hero */
.chain{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:24px;align-items:start}
.chain-head{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.streak-num{font:800 3.6rem/1 var(--f-display);color:var(--brass);font-variant-numeric:tabular-nums}
.streak-lbl{font-family:var(--f-display);font-weight:700;font-size:1.15rem}
.chain-msg{margin-top:4px}
.chain-svg-box{overflow-x:auto;margin-top:14px}
.chain-svg{display:block;width:100%;min-width:520px;height:auto}
.chain-side{display:flex;flex-direction:column;gap:14px}
.stat-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--sunk);border-radius:12px;padding:10px 12px}
.stat b{display:block;font:700 1.35rem/1.2 var(--f-display);font-variant-numeric:tabular-nums}
.stat span{font-size:.78rem;color:var(--muted)}
.today-bar{height:10px;background:var(--sunk);border-radius:99px;overflow:hidden}
.today-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--brass),var(--brass-2));border-radius:99px;transition:width .4s}
.goal-sel{display:flex;gap:6px;flex-wrap:wrap}
.goal-sel button{border:1px solid var(--line);background:transparent;border-radius:8px;padding:3px 10px;font-size:.82rem}
.goal-sel button[aria-pressed="true"]{border-color:var(--brass);color:var(--brass);font-weight:600}
.heat-box{margin-top:18px;overflow-x:auto}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,14px);gap:3px;width:max-content}
.heat i{width:14px;height:14px;border-radius:3px;background:var(--sunk)}
.heat i.l1{background:color-mix(in srgb,var(--brass) 30%,var(--sunk))}
.heat i.l2{background:color-mix(in srgb,var(--brass) 65%,var(--sunk))}
.heat i.l3{background:var(--brass)}
.heat i.l4{background:var(--brass-2)}
.heat i.future{background:transparent}
.heat i.today{outline:1.5px solid var(--ink);outline-offset:1px}
.legend{display:flex;align-items:center;gap:4px;font-size:.75rem;color:var(--muted);margin-top:8px}
.legend i{width:11px;height:11px;border-radius:2px;display:inline-block}

/* modes */
.modes{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.mode{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:8px;transition:border-color .15s,transform .15s}
.mode:hover{border-color:var(--teal);transform:translateY(-1px)}
.mode .tag{font:600 .68rem/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--teal)}
.mode h3{font-size:1.1rem}
.mode p{font-size:.88rem;color:var(--muted)}

.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
.list{display:flex;flex-direction:column}
.item{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line);text-align:left;background:none;border-left:0;border-right:0;border-bottom:0;width:100%}
.item:first-child{border-top:0}
.item .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip{display:inline-block;font:600 .7rem/1 var(--f-mono);letter-spacing:.05em;text-transform:uppercase;padding:5px 8px;border-radius:6px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.bars{display:flex;flex-direction:column;gap:8px}
.bar{display:grid;grid-template-columns:120px minmax(0,1fr) 34px;gap:10px;align-items:center;font-size:.86rem}
.bar .track{height:8px;background:var(--sunk);border-radius:99px;overflow:hidden}
.bar .track i{display:block;height:100%;background:var(--danger);opacity:.8;border-radius:99px}
.empty{padding:18px;text-align:center;color:var(--muted);font-size:.9rem;border:1px dashed var(--line);border-radius:12px}

/* setup */
.setup{display:flex;flex-direction:column;gap:18px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-size:.88rem}
.opt[aria-pressed="true"]{background:var(--teal);border-color:var(--teal);color:#fff}
.scen{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.scen button{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.scen button[aria-pressed="true"]{border-color:var(--teal);box-shadow:inset 0 0 0 1px var(--teal)}
.scen small{color:var(--muted)}
label.field{display:flex;flex-direction:column;gap:6px;font-size:.88rem;font-weight:500}
input[type=text],textarea,select{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 12px;width:100%}
textarea{resize:vertical;min-height:70px}
.toggles{display:flex;gap:18px;flex-wrap:wrap}
.toggle{display:flex;gap:8px;align-items:center;font-size:.9rem}
.toggle input{width:18px;height:18px;accent-color:var(--teal)}

/* session */
.sess-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.timer{font:600 1.1rem var(--f-mono);font-variant-numeric:tabular-nums}
.feed{display:flex;flex-direction:column;gap:12px;min-height:240px}
.msg{max-width:min(640px,88%);padding:12px 16px;border-radius:14px;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.ai{background:var(--sunk);align-self:flex-start;border-bottom-left-radius:4px}
.msg.me{background:color-mix(in srgb,var(--teal) 14%,var(--surface));border:1px solid color-mix(in srgb,var(--teal) 35%,var(--line));align-self:flex-end;border-bottom-right-radius:4px}
.msg .meta{display:block;font:500 .7rem var(--f-mono);color:var(--muted);margin-top:6px}
.msg.live{opacity:.7;font-style:italic}
.controls{display:flex;flex-direction:column;gap:12px;align-items:center;padding-top:6px}
.mic{width:84px;height:84px;border-radius:50%;border:0;background:var(--teal);color:#fff;display:grid;place-items:center;box-shadow:0 6px 18px -6px color-mix(in srgb,var(--teal) 70%,transparent)}
.mic.on{background:var(--danger);animation:pulse 1.4s ease-in-out infinite}
.mic.opening{background:var(--brass);animation:none}
.kb-card{display:flex;flex-direction:column;gap:8px;align-items:center;text-align:center;background:var(--sunk);border-radius:12px;padding:12px 14px;max-width:640px;font-size:.88rem}
.mic:disabled{opacity:.45;animation:none}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--danger) 45%,transparent)}50%{box-shadow:0 0 0 14px transparent}}
.typed{display:flex;gap:8px;width:100%;max-width:640px}
.typed textarea{min-height:48px}
.phase{text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}
.phase .big{font:800 3.4rem/1 var(--f-display);font-variant-numeric:tabular-nums}
.phase .q{font-size:1.1rem;max-width:640px;background:var(--sunk);border-radius:14px;padding:16px 18px;text-align:left}
.ring-lbl{font:600 .78rem var(--f-mono);letter-spacing:.08em;text-transform:uppercase}
.ring-lbl.prep{color:var(--brass)} .ring-lbl.speak{color:var(--danger)}

/* report */
.scores{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.score{background:var(--sunk);border-radius:12px;padding:12px}
.score b{font:700 1.5rem var(--f-display);font-variant-numeric:tabular-nums}
.score b small{font-size:.85rem;color:var(--muted);font-weight:500}
.score .track{height:6px;background:var(--line);border-radius:99px;margin-top:8px;overflow:hidden}
.score .track i{display:block;height:100%;background:var(--teal)}
.transcript{display:flex;flex-direction:column;gap:10px}
.tline{display:grid;grid-template-columns:44px minmax(0,1fr);gap:10px}
.tline .who{font:600 .72rem var(--f-mono);color:var(--muted);padding-top:3px}
.tline.me .txt{font-size:1rem}
.tline.ai .txt{color:var(--muted);font-size:.92rem}
mark.err{background:var(--err-bg);color:inherit;border-bottom:2px solid var(--danger);padding:0 2px;border-radius:3px}
mark.up{background:var(--up-bg);color:inherit;border-bottom:2px dotted var(--brass);padding:0 2px;border-radius:3px}
.errs{display:flex;flex-direction:column;gap:10px}
.err{border:1px solid var(--line);border-left:3px solid var(--danger);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.err.upg{border-left-color:var(--brass)}
.err .fix{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:baseline}
.err s{color:var(--danger);text-decoration-thickness:1.5px}
.err .good{color:var(--ok);font-weight:600}
.err .expl{font-size:.88rem;color:var(--muted)}
.retry-out{font-size:.86rem;padding:8px 10px;border-radius:8px;background:var(--sunk)}
.kv{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:.88rem}
.kv span b{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
ul.clean{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px}
.spinner{width:22px;height:22px;border:3px solid var(--line);border-top-color:var(--teal);border-radius:50%;animation:spin .8s linear infinite;display:inline-block;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:.9rem;z-index:20;max-width:calc(100% - 32px)}
@media (max-width:820px){.chain{grid-template-columns:1fr}.two{grid-template-columns:1fr}}
@media (max-width:480px){.streak-num{font-size:2.8rem}.bar{grid-template-columns:96px minmax(0,1fr) 28px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<style>
html{-webkit-text-size-adjust:100%}
body{padding-top:max(20px,calc(env(safe-area-inset-top,0px) + 12px));padding-bottom:max(48px,calc(env(safe-area-inset-bottom,0px) + 32px));-webkit-tap-highlight-color:transparent}
.settings{display:flex;flex-direction:column;gap:16px}
.settings .field small{color:var(--muted);font-weight:400}
.keyrow{display:flex;gap:8px}
.keyrow input{flex:1;min-width:0}
.ok-txt{color:var(--ok)} .bad-txt{color:var(--danger)}
.mic-reopen{margin-top:4px}
input[type=range]{width:100%;accent-color:var(--teal)}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <svg width="34" height="22" viewBox="0 0 34 22" aria-hidden="true"><rect x="2" y="5" width="18" height="12" rx="6" fill="none" stroke="var(--brass)" stroke-width="3.2"/><rect x="14" y="5" width="18" height="12" rx="6" fill="none" stroke="var(--teal)" stroke-width="3.2"/></svg>
      <h1>Speak Chain</h1>
    </div>
    <nav class="nav" id="nav">
      <button data-go="home" aria-current="true">Ana sayfa</button>
      <button data-go="book">Hata defteri</button>
      <button data-go="settings">Ayarlar</button>
    </nav>
  </header>
  <div id="notes"></div>
  <main id="view"></main>
</div>

<script>
(() => {
'use strict';
// ---------- helpers ----------
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dayKey = (d = new Date()) => { const x = new Date(d); return x.getFullYear() + '-' + String(x.getMonth()+1).padStart(2,'0') + '-' + String(x.getDate()).padStart(2,'0'); };
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const fmtTime = s => { s = Math.max(0, Math.round(s)); return Math.floor(s/60) + ':' + String(s%60).padStart(2,'0'); };
const words = t => (t.trim().match(/[A-Za-z0-9'’-]+/g) || []).length;
const join = (...p) => p.map(x => (x||'').trim()).filter(Boolean).join(' ');
const DOW = ['Pz','Pt','Sa','Ça','Pe','Cu','Ct'];
const pick = a => a[Math.floor(Math.random()*a.length)];
let toastTimer;
function toast(msg){ let t = $('.toast'); if(!t){ t = document.createElement('div'); t.className='toast'; t.setAttribute('role','status'); document.body.append(t);} t.textContent = msg; clearTimeout(toastTimer); toastTimer = setTimeout(()=>t.remove(), 4500); }

// ---------- modes ----------
const MODES = {
  free:{label:'Serbest Konu', tag:'Sohbet', desc:'Seçtiğin alanda rastgele bir soru gelir. AI cevabına göre konuşmayı sürdürür, sen bitirene kadar devam eder.', kind:'chat'},
  itep:{label:'iTEP Simülasyonu', tag:'Sınav', desc:'İki bölüm: kısa soru, sonra iki taraflı bir konu. Hazırlık ve konuşma süreleri var, AI araya girmez.', kind:'itep'},
  interview:{label:'Mülakat Provası', tag:'Kariyer', desc:'Davranışsal ve kalite mühendisliği teknik soruları. Cevabın yapısına da geri bildirim alırsın.', kind:'chat'},
  roleplay:{label:'İş Senaryosu', tag:'Rol', desc:'Tedarikçi görüşmesi, müşteri denetimi, toplantı gibi gerçek iş durumlarında rol yapma.', kind:'chat'},
  debate:{label:'Münazara', tag:'Argüman', desc:'Görüşünü söylersin, AI karşı tarafı savunup itiraz eder.', kind:'chat'},
  explain:{label:'Basitçe Anlat', tag:'Açıklama', desc:'Teknik bir kavramı mühendis olmayan birine anlatırsın. AI anlamayan biri gibi sorular sorar.', kind:'chat'},
};
const CATS = ['Rastgele','Spor','Sanat','Hayat','Politika','Eğitim','Mühendislik','Sağlık','Genel kültür','Bilim ve teknoloji','Seyahat','İş hayatı'];
const CAT_EN = {'Spor':'sports','Sanat':'art','Hayat':'everyday life','Politika':'politics and society','Eğitim':'education','Mühendislik':'engineering','Sağlık':'health','Genel kültür':'general knowledge and culture','Bilim ve teknoloji':'science and technology','Seyahat':'travel','İş hayatı':'work life'};
const SCENARIOS = [
  {id:'supplier', tr:'Tedarikçiye şikayet görüşmesi', brief:'Bir tedarikçiden gelen parçalarda tekrar eden ölçü uygunsuzluğu var. Tedarikçinin kalite müdürünü arıyorsun. O biraz savunmada.', en:'The learner is a supplier quality engineer calling a supplier about a recurring dimensional nonconformity on delivered parts. You are the supplier\'s quality manager: polite but defensive, you question their measurement method and try to avoid a formal 8D.'},
  {id:'audit', tr:'Müşteri denetiminde bulgu', brief:'Müşteri denetçisi kalibrasyon kayıtlarıyla ilgili bir bulgu yazmak üzere. Durumu açıklayıp bulguyu yumuşatmaya çalışıyorsun.', en:'You are a customer auditor during an on-site process audit. You found that two gauges in use have expired calibration records. The learner is the plant\'s quality engineer and must explain and propose containment. Be firm and ask probing follow-ups.'},
  {id:'meeting', tr:'Toplantıda kök neden anlatma', brief:'Üretim müdürü, bulduğun kök nedene ikna olmamış. Analizini anlatıp aksiyonları kabul ettirmen gerekiyor.', en:'You are a production manager in a meeting. The learner presents a root cause analysis for a field failure that blames a process parameter in your area. You are skeptical, worried about cost and downtime, and push back.'},
  {id:'deadline', tr:'Teslim tarihi pazarlığı', brief:'Müşterinin satın alma müdürü daha erken teslim istiyor, ama parti kalite blokajında. Hem ilişkiyi korumalı hem de kaliteden taviz vermemelisin.', en:'You are a customer\'s purchasing manager demanding an earlier delivery. The learner is a quality engineer whose lot is on quality hold pending re-inspection. Pressure them politely but persistently; accept a reasonable compromise only if well argued.'},
  {id:'random', tr:'Sürpriz senaryo', brief:'AI bir iş senaryosu kurar ve rolünü sana ilk mesajda anlatır.', en:'Invent a realistic workplace scenario for a quality engineer in manufacturing (with a counterpart role for you). Describe the situation and the learner\'s role in one or two sentences, then start in character.'},
];
const CONCEPTS = ['FMEA','SPC','8D','Cpk','PPAP','5 Neden','Kalibrasyon','Tolerans','Kontrol planı','First Article Inspection'];
const MOTIONS = ['Remote work makes companies less innovative.','University education should be free for everyone.','Social media does more harm than good.','Self-driving cars should be allowed on public roads now.','Professional athletes are overpaid.','Governments should tax sugary drinks.','Museums should return artifacts to their countries of origin.','Standardized exams are a fair way to measure ability.'];

// ---------- Gemini API ----------
const GEMINI = 'https://generativelanguage.googleapis.com/v1beta/';
const thinkOK = {minimal:true, low:true};   // levels the API has rejected are switched off
const THINK_NEXT = {minimal:'low', low:null};
const thinkLevel = l => { while(l && !thinkOK[l]) l = THINK_NEXT[l]; return l; };
async function geminiFetch(path, body){
  let res;

    res = await fetch(GEMINI + path, { method: body ? 'POST' : 'GET', headers: {'content-type':'application/json','x-goog-api-key':state.settings.apiKey}, ...(body ? {body: JSON.stringify(body)} : {}) });
  }catch(e){ throw {code:'network'}; }

}
function partsText(cand){ return (cand?.content?.parts || []).filter(p => !p.thought && typeof p.text === 'string').map(p => p.text).join(''); }
const sleep = ms => new Promise(r => setTimeout(r, ms));
const isTransient = e => e && e.code === 'http' && (e.status >= 500 || e.status === 408);
const modelSwap = {};   // model -> working substitute for the rest of this app session
async function callModel(model, {system, messages, max_tokens, onText, json, think = 'minimal'}){
  const build = () => { const lv = thinkLevel(think); return {
    contents: messages.map(m => ({role: m.role === 'assistant' ? 'model' : 'user', parts:[{text:m.content}]})),
    ...(system ? {systemInstruction:{parts:[{text:system}]}} : {}),
    generationConfig: { maxOutputTokens: max_tokens, ...(json ? {responseMimeType:'application/json'} : {}), ...(lv ? {thinkingConfig:{thinkingLevel:lv}} : {}) }
  }; };
  const path = `models/${encodeURIComponent(model)}:${onText ? 'streamGenerateContent?alt=sse' : 'generateContent'}`;
  const t0 = Date.now();
  let res, last;
  for(let attempt = 0; attempt < 2; attempt++){
    try{ res = await geminiFetch(path, build()); break; }
    catch(e){
      e.model = model; last = e;
      const lv = thinkLevel(think);
      if(lv && e.code === 'http' && e.status === 400 && /thinking/i.test(e.message || '')){ thinkOK[lv] = false; diag('Düşünme seviyesi "' + lv + '" desteklenmiyor, düşürüldü'); attempt--; continue; }
      diag(model + ' hata ' + (e.status || e.code));
      if(!isTransient(e) || attempt === 1) throw e;
      await sleep(900);
    }
  }
  if(!res) throw last;
  let text = '', finish = '', block = '';
  const take = d => { if(d.promptFeedback?.blockReason) block = d.promptFeedback.blockReason; const c = d.candidates?.[0]; if(c){ text += partsText(c); if(c.finishReason) finish = c.finishReason; } };
  if(!onText){ take(await res.json()); }
  else {
    const reader = res.body.getReader(), dec = new TextDecoder(); let buf = '';
    for(;;){
      const {value, done} = await reader.read(); if(done) break;
      buf += dec.decode(value, {stream:true}).replace(/\r/g, '');
      let i;
      while((i = buf.indexOf('\n\n')) >= 0){
        const evt = buf.slice(0, i); buf = buf.slice(i + 2);
        for(const line of evt.split('\n')){ if(!line.startsWith('data:')) continue; let d; try{ d = JSON.parse(line.slice(5)); }catch{ continue; } if(d.error) throw {code:'http', status:d.error.code || 500, message:d.error.message, gstatus:d.error.status, model}; take(d); onText(text); }
      }
    }
  }
  if(!text.trim()){
    if(block || finish === 'SAFETY' || finish === 'PROHIBITED_CONTENT') throw {code:'blocked', model};
    if(finish === 'MAX_TOKENS') throw {code:'truncated', model};
  }

  return text;
}
// Same-class models to fall back to when one is overloaded, missing or out of free quota.
function alternatesFor(model){
  const avail = state.settings.models || [];
  const lite = /lite/i.test(model);
  const pref = lite ? [...QUICK_PREF, ...MAIN_PREF] : [...MAIN_PREF, ...QUICK_PREF];
  const extra = avail.filter(m => /flash/i.test(m) && !/image|tts|audio|live|embed|native/i.test(m));
  return [...new Set([...pref.filter(m => avail.includes(m)), ...extra])].filter(m => m !== model).slice(0, 3);
}
async function callAI(opts){
  if(!hasKey()) throw {code:'no_key'};
  const want = (opts.model || state.settings.model).replace(/^models\//, '');
  const first = modelSwap[want] || want;
  const chain = [first, ...alternatesFor(first)];
  let lastErr;
  for(const m of chain){
    try{ const t = await callModel(m, {max_tokens:1024, json:false, ...opts}); if(m !== want) modelSwap[want] = m; return t; }
    catch(e){
      lastErr = e;
      if(!(isTransient(e) || (e.code === 'http' && (e.status === 404 || e.status === 429)))) throw e;
    }
  }
  throw lastErr;
}
async function listModels(){
  const out = []; let token = '';
  for(let i = 0; i < 5; i++){
    const res = await geminiFetch('models?pageSize=1000' + (token ? '&pageToken=' + encodeURIComponent(token) : ''));
    const j = await res.json();
    for(const m of (j.models || [])) if((m.supportedGenerationMethods || []).includes('generateContent')) out.push(m.name.replace(/^models\//, ''));
    token = j.nextPageToken; if(!token) break;
  }
  return out;
}
function parseJSON(t){
  try{ return JSON.parse(t); }catch{}
  const f = t.match(/```(?:json)?\s*([\s\S]*?)```/); if(f){ try{ return JSON.parse(f[1]); }catch{} }
  const a = t.indexOf('{'), b = t.lastIndexOf('}'); if(a >= 0 && b > a){ try{ return JSON.parse(t.slice(a, b+1)); }catch{} }
  throw {code:'invalid_json'};
}
async function askJSON(prompt, {quick = false, max_tokens = 4000, think = 'minimal'} = {}){
  const t = await callAI({messages:[{role:'user', content:prompt}], model: quick ? state.settings.quickModel : state.settings.model, max_tokens, json:true, think, system:'Reply with a single valid JSON value only. No prose, no markdown fences.'});
  return parseJSON(t);
}
function apiErr(e){
  if(!e) return 'Bilinmeyen hata.';
  const where = e.model ? ' [' + e.model + ']' : '';
  if(e.code === 'no_key') return 'Önce Ayarlar\'dan Gemini API anahtarını gir.';
  if(e.code === 'network') return 'Gemini\'ye ulaşılamadı. İnternet bağlantını kontrol et.';
  if(e.code === 'invalid_json') return 'Yanıt okunamadı. Tekrar dene.';
  if(e.code === 'blocked') return 'Gemini bu isteği güvenlik filtresi nedeniyle yanıtlamadı. Farklı bir konuyla dene.';
  if(e.code === 'truncated') return 'Yanıt uzunluk sınırında kesildi. Tekrar dene.';
  if(e.code === 'http'){
    const m = (e.message || '').slice(0, 220);
    const detail = ' (Kod ' + e.status + (e.gstatus ? ' ' + e.gstatus : '') + where + (m ? ': ' + m : '') + ')';
    if(e.status === 400 && /api key/i.test(m)) return 'API anahtarı geçersiz. Ayarlar\'dan kontrol et.' + detail;
    if(e.status === 401 || e.status === 403) return 'Bu API anahtarının yetkisi yok.' + detail;
    if(e.status === 404) return 'Model bulunamadı.' + detail;
    if(e.status === 429) return 'Kullanım sınırına ulaşıldı (ücretsiz kota dolmuş olabilir). Biraz bekleyip tekrar dene.' + detail;
    if(e.status >= 500) return 'Google tarafında bir sorun var, birkaç deneme de başarısız oldu.' + detail;
    return 'Gemini hatası.' + detail;
  }
  return (e.message || 'Bilinmeyen hata.') + where;
}

// ---------- speech synthesis ----------
let voices = [];
function loadVoices(){ if(!canTTS) return; voices = speechSynthesis.getVoices().filter(v => /^en[-_]/i.test(v.lang)); if(state.view === 'settings'){ renderVoiceSelect(); const vc = document.getElementById('voiceCount'); if(vc) vc.textContent = voices.length; } }
if(canTTS){ loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; }
function pickVoice(){
  const s = state.settings.voiceURI; if(s){ const v = voices.find(v => v.voiceURI === s); if(v) return v; }
  const us = voices.filter(v => /en[-_]US/i.test(v.lang));
  return us.find(v => /premium|enhanced/i.test(v.name)) || us.find(v => /samantha|ava|allison|nicky/i.test(v.name)) || us[0] || voices[0] || null;
}
function ttsChunks(text){
  const parts = String(text).replace(/\s+/g, ' ').match(/[^.!?]+[.!?]*\s*/g) || [text];
  const out = []; let cur = '';
  for(const p of parts){ if((cur + p).length > 220 && cur){ out.push(cur.trim()); cur = p; } else cur += p; }
  if(cur.trim()) out.push(cur.trim());
  return out;
}
function makeUtt(t){
  const u = new SpeechSynthesisUtterance(t);
  const v = (IS_IOS && !state.settings.voiceURI) ? null : pickVoice(); if(v) u.voice = v;
  u.lang = v ? v.lang : 'en-US'; u.rate = state.settings.rate || 1;
  u.onerror = e => { if(e.error !== 'interrupted' && e.error !== 'canceled') diag('Ses hatası: ' + (e.error || '?')); };
  return u;
}
let ttsWatch = null;
function speak(text, force){
  if(!canTTS || !text || (!state.settings.tts && !force)) return;
  const synth = speechSynthesis, list = ttsChunks(text);
  let started = false;
  try{
    if(force && (synth.speaking || synth.pending)) synth.cancel();
    synth.resume();
    list.forEach((c, i) => { const u = makeUtt(c); if(i === 0){ u.onstart = () => { started = true; diag('Ses çalmaya başladı'); }; } synth.speak(u); });
  }catch(e){ diag('Ses çalınamadı: ' + e.message); }
  clearTimeout(ttsWatch);
  ttsWatch = setTimeout(() => { if(!started && !synth.speaking){ diag('Ses başlamadı'); if(state.view === 'session') toast('Ses çalmadı. Dinlemek için "🔊 AI\'ın son cevabını dinle" butonuna bas.'); } }, 2500);
}
function stopSpeak(){ try{ if(canTTS && (speechSynthesis.speaking || speechSynthesis.pending)) speechSynthesis.cancel(); }catch{} }
// iOS only lets a page speak after it has spoken once inside a tap. Called from the start button.
function unlockTTS(){ if(!canTTS || !state.settings.tts) return; try{ const u = makeUtt("Okay, let's begin."); u.onstart = () => diag('Ses kilidi açıldı'); speechSynthesis.speak(u); }catch{} }

// ---------- speech recognition ----------
// target: 'chat' | 'itep-prep' | 'itep-speak' | 'retry'

function srStart(target, keep){

  if(!keep){ dict.base = ''; dict.fin = ''; dict.interim = ''; dict.startAt = Date.now(); dict.activeMs = 0; }

}
const SR_MSG = {
  'not-allowed': 'Mikrofon izni verilmedi. iPhone\'da Ayarlar > Uygulamalar > Safari > Mikrofon seçeneğini "Sor" veya "İzin Ver" yap, sonra sayfayı yeniden aç.',
  'service-not-allowed': 'Konuşma tanıma kapalı. iPhone\'da Ayarlar > Genel > Klavye > Dikteyi Etkinleştir açık olmalı ve Ayarlar > Gizlilik ve Güvenlik > Konuşma Tanıma bölümünde Safari\'ye izin verilmeli.',
  'audio-capture': 'Mikrofona erişilemedi. Başka bir uygulama mikrofonu kullanıyor olabilir.',
  'network': 'Konuşma tanıma için internet gerekiyor.',

function srChanged(){
  if(dict.target === 'itep-prep') return;
  if((dict.target === 'chat' || dict.target === 'itep-speak') && state.sess){ state.sess.live = srLive(); updateLive(); }
  if(dict.target === 'retry') updateRetryLive();
  if(dict.target === 'diag'){ const el = document.getElementById('diagLive'); if(el) el.textContent = srLive() || '…'; }
}

    if(!srText()){ dict.fails++; toast(!dict.audio ? 'Mikrofon açılamadı. Tekrar bas.' : dict.heard ? 'Ses alındı ama metne çevrilemedi. Daha yakından ve net konuşup tekrar dene.' : 'Seni duyamadım. Mikrofon kırmızıyken konuş.'); }

// ---------- chain stats ----------
function minutesByDay(){ const m = {}; for(const s of state.sessions){ m[s.day] = (m[s.day] || 0) + (s.durationSec || 0)/60; } return m; }
function chainStats(){
  const m = minutesByDay(), goal = state.settings.goalMin;
  const done = k => (m[k] || 0) >= goal;
  const today = new Date(), tk = dayKey(today);
  let cur = 0, d = done(tk) ? today : addDays(today, -1);
  while(done(dayKey(d))){ cur++; d = addDays(d, -1); }
  const keys = Object.keys(m).filter(done).sort();
  let longest = 0, run = 0, prev = null;
  for(const k of keys){ if(prev && dayKey(addDays(new Date(prev + 'T12:00'), 1)) === k) run++; else run = 1; longest = Math.max(longest, run); prev = k; }
  const totalMin = Object.values(m).reduce((a,b)=>a+b,0);
  return {m, goal, done, cur, longest, doneDays:keys.length, todayMin:m[tk] || 0, todayDone:done(tk), totalMin};
}
function chainSVG(st){

  let links = '', labels = '';
  for(let i = 0; i < N; i++){
    const d = addDays(today, i - (N-1)), k = dayKey(d), cx = 12 + i*step + step/2;
    const isToday = i === N-1, ok = st.done(k), min = Math.round(st.m[k] || 0);
    const horiz = i % 2 === 0, w = 44, h = horiz ? 26 : 12, y = 30 - h/2;
    const tip = `<title>${d.toLocaleDateString('tr-TR',{day:'numeric',month:'long'})}: ${min} dk${ok?' · hedef tamam':''}</title>`;
    if(ok) links += `<g>${tip}<rect x="${cx-w/2}" y="${y}" width="${w}" height="${h}" rx="${h/2}" fill="none" stroke="url(#gb)" stroke-width="${horiz?5.5:5}"/></g>`;

    else { const r = h/2, l = cx - w/2, rr = cx + w/2;
      links += `<g opacity=".75">${tip}<path d="M ${cx-5} ${y} H ${l+r} A ${r} ${r} 0 0 0 ${l+r} ${y+h} H ${cx-8}" fill="none" stroke="var(--line)" stroke-width="4" stroke-linecap="round"/><path d="M ${cx+8} ${y} H ${rr-r} A ${r} ${r} 0 0 1 ${rr-r} ${y+h} H ${cx+5}" fill="none" stroke="var(--line)" stroke-width="4" stroke-linecap="round"/></g>`; }
    labels += `<text x="${cx}" y="66" text-anchor="middle" font-size="10" font-family="var(--f-mono)" fill="${isToday?'var(--ink)':'var(--muted)'}" font-weight="${isToday?700:400}">${isToday?'bugün':DOW[d.getDay()]}</text>`;
  }
  return `<svg class="chain-svg" viewBox="0 0 ${W} ${H}" role="img" aria-label="Son 21 günün zinciri"><defs><linearGradient id="gb" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:var(--brass-2)"/><stop offset="1" style="stop-color:var(--brass)"/></linearGradient></defs>${links}${labels}<style>@media (prefers-reduced-motion:no-preference){.pend{animation:dash 2.4s linear infinite}}@keyframes dash{to{stroke-dashoffset:-36}}</style></svg>`;
}
function heatmap(st){
  const weeks = 18, today = new Date(), dow = (today.getDay() + 6) % 7, start = addDays(today, -(weeks-1)*7 - dow);
  let cells = '';
  for(let i = 0; i < weeks*7; i++){
    const d = addDays(start, i), k = dayKey(d);
    if(d > today){ cells += '<i class="future"></i>'; continue; }
    const min = st.m[k] || 0, f = min / st.goal;
    const l = min <= 0 ? '' : f < .5 ? 'l1' : f < 1 ? 'l2' : f < 2 ? 'l3' : 'l4';
    cells += `<i class="${l}${k===dayKey(today)?' today':''}" title="${d.toLocaleDateString('tr-TR',{day:'numeric',month:'short'})}: ${Math.round(min)} dk"></i>`;
  }
  return `<div class="heat-box"><div class="heat" aria-label="Son 18 haftanın pratik takvimi">${cells}</div></div>
  <div class="legend">Az <i style="background:var(--sunk)"></i><i style="background:color-mix(in srgb,var(--brass) 30%,var(--sunk))"></i><i style="background:color-mix(in srgb,var(--brass) 65%,var(--sunk))"></i><i style="background:var(--brass)"></i><i style="background:var(--brass-2)"></i> 2× hedef</div>`;
}
function chainMessage(st){
  if(st.todayDone) return st.cur > 1 ? `Bugünün halkası tamam. ${st.cur} gündür zincir kırılmadı.` : 'Bugünün halkası tamam. Yarın da ekle, zincir büyüsün.';
  const left = Math.max(1, Math.ceil(st.goal - st.todayMin));
  if(st.cur > 0) return `Zincir ${st.cur} günlük. Bugün ${left} dakika daha konuşursan kırılmaz.`;
  if(state.sessions.length) return `Zincir koptu. Bugün ${left} dakikalık pratikle yeni bir halka başlat.`;
  return `Günde ${st.goal} dakika konuşunca bir halka eklenir. İlk halkayı bugün tak.`;
}

function allErrors(days){ const cutoff = days ? Date.now() - days*864e5 : 0, out = []; for(const s of state.sessions){ if(s.startedAt < cutoff || !s.analysis) continue; for(const e of (s.analysis.errors || [])) out.push({...e, at:s.startedAt}); } return out; }
function errorCounts(days){ const c = {}; for(const e of allErrors(days)){ const k = ERR_TR[e.category] ? e.category : 'other'; c[k] = (c[k]||0) + 1; } return Object.entries(c).sort((a,b)=>b[1]-a[1]); }

function weakAreas(){ return errorCounts(30).slice(0,3).map(([k]) => k); }

function learnerProfile(){
  const w = weakAreas();
  return `The learner is a Turkish quality engineer in machinery manufacturing (supplier quality, 8D, audits, ISO 9001), preparing for a C1-level English exam and job interviews.` + (w.length ? ` Recurring weak areas from past sessions: ${w.map(k=>k.replace('_',' ')).join(', ')}. Naturally create chances for them to use these structures.` : '');
}
function chatInstructions(s){
  const common = `${learnerProfile()}
Their messages are speech-to-text transcripts: ignore punctuation and capitalization, and if a word looks misrecognized, read it charitably.
Speak naturally in English. Keep each reply to 2-4 sentences, react specifically to what they said, then ask exactly one question that pushes them to elaborate. Do not lecture.
${state.settings.instant ? 'Instant correction is ON: if their last message had a serious error (one that a C1 examiner would penalize), start your reply with one short line "Quick fix: <their phrase> → <better phrase>." then continue normally. Skip it when there is nothing serious.' : 'Do NOT correct their English during the conversation; feedback comes afterwards.'}
Reply with only the words you would say out loud. No stage directions, no markdown.`;
  let role = '';
  if(s.mode === 'free'){
    const cat = s.cat === 'Rastgele' ? pick(Object.values(CAT_EN)) : CAT_EN[s.cat];
    const avoid = state.sessions.filter(x=>x.mode==='free').slice(0,10).map(x=>x.title).filter(Boolean);
    role = `You are a friendly, curious conversation partner. Open with one engaging, specific question about ${cat} that invites an opinion or a personal story (not a yes/no question). Random seed: ${Math.random().toString(36).slice(2,8)}.${avoid.length?` Avoid these recent openers: ${avoid.join(' | ')}.`:''}${s.focus?' This session focuses on the learner\'s weak areas listed above; steer questions so they must use them.':''}`;
  } else if(s.mode === 'interview'){
    const t = {mixed:'a mix of behavioral (STAR-style "Tell me about a time…") and technical quality-engineering questions (8D, root cause analysis, FMEA, audits, nonconformance handling, supplier management, AS9100/ISO 9001)', behavioral:'behavioral questions in the "Tell me about a time…" style', technical:'technical quality-engineering questions (8D, RCA, FMEA, SPC, audits, nonconformance, supplier quality, AS9100/ISO 9001)'}[s.itype];
    role = `You are an experienced interviewer hiring for the position: ${s.role}. Ask ${t}, one at a time. Follow up when an answer is vague or lacks a concrete result, and occasionally challenge them politely. Start by greeting briefly and asking the first question.`;
  } else if(s.mode === 'roleplay'){
    role = `Role-play. ${SCENARIOS.find(x=>x.id===s.scen).en} Stay in character. Open the scene in character with your first line.`;
  } else if(s.mode === 'debate'){
    role = `Debate partner. The motion is: "${s.motion}". First ask the learner whether they agree or disagree and why. Then always argue the OPPOSITE side firmly, with concrete counter-arguments, and challenge weak points in their reasoning. Concede a point only when it is genuinely well argued.`;
  } else if(s.mode === 'explain'){

async function aiTurn(){
  const S = state.sess; if(!S) return;
  S.busy = true; S.streaming = ''; renderSession();
  const msgs = [{role:'user', content:'Begin now with your opening line.'}];
  for(const t of S.turns) msgs.push({role: t.role === 'ai' ? 'assistant' : 'user', content: t.text});
  while(JSON.stringify(msgs).length > 120000 && msgs.length > 4) msgs.splice(1, 2);
  try{
    const text = (await callAI({system:S.instructions, messages:msgs, max_tokens:1024, think:'minimal', onText: t => { S.streaming = t; updateStreaming(); }})).trim();
    if(state.sess !== S) return;
    S.turns.push({role:'ai', text: text || '…'});
    if(!S.title && S.mode === 'free') S.title = text.split(/(?<=[?.!])\s/)[0].slice(0, 110);
    S.streaming = ''; S.busy = false; renderSession();

  let secs = null, isTyped = !spoken;

  dict.target = null; dict.base = ''; dict.activeMs = 0; S.live = ''; S.typedDraft = ''; S.typeStart = 0; if(ta) ta.value = '';
  S.turns.push({role:'me', text, secs, typed:isTyped, kb: isTyped ? false : !spoken});

}

    const avoid = state.sessions.filter(x=>x.mode==='itep').slice(0,6).map(x=>x.title).filter(Boolean);
    const q = await askJSON(`Write a fresh iTEP-style speaking prompt pair. Reply with only JSON: {"part1":"...","part2_statement":"...","part2_question":"..."}.

part2_question: asks the examinee which side they agree with and why.

    if(!q || !q.part1 || !q.part2_statement) throw {message:'Soru üretilemedi.'};
    S.itep = { qs:[q.part1, q.part2_statement + '\n\n' + (q.part2_question||'Which view do you agree with, and why?')], part:0, phase:'ready', left:0 };

function analysisPrompt(rec){

    itep:'This was an iTEP-style speaking test (Part 1 short question, Part 2 opinion on a two-sided issue). Score each criterion on the iTEP 0-6 scale (one decimal). In "mode_feedback_tr" comment on whether each part answered the prompt, organization and use of time. Provide "model_answer": an improved version of the learner\'s Part 2 answer that keeps their ideas, at C1 level, about 120-150 words.',
    interview:'This was a job interview. In "mode_feedback_tr" assess answer structure (STAR: situation, task, action, result), concreteness, whether results were quantified, length, and professional tone. Provide "model_answer": a stronger version of their weakest answer, keeping their content.',
    roleplay:'This was a workplace role-play. In "mode_feedback_tr" assess politeness vs firmness, clarity of requests, negotiation moves and professional register.',
    debate:'This was a debate. In "mode_feedback_tr" assess argument structure, use of evidence, how they handled counter-arguments, and hedging/stance language.',
    explain:'This was an "explain a technical concept simply" exercise. In "mode_feedback_tr" assess clarity for a non-expert, jargon handling, use of examples/analogies, and logical order.',

${extra}

${tr}

{

async function analyze(rec){

function highlight(text, errs, ups){
  const ranges = [], low = text.toLowerCase();
  const add = (sub, cls) => { if(!sub) return; let from = 0, i; const s = sub.toLowerCase(); while((i = low.indexOf(s, from)) >= 0){ if(!ranges.some(r => i < r.e && i + s.length > r.s)){ ranges.push({s:i, e:i+s.length, cls}); return; } from = i + 1; } };
  errs.forEach(e => add(e.original, 'err')); ups.forEach(u => add(u.original, 'up'));
  ranges.sort((a,b)=>a.s-b.s);
  let out = '', p = 0;
  for(const r of ranges){ out += esc(text.slice(p, r.s)) + `<mark class="${r.cls}">${esc(text.slice(r.s, r.e))}</mark>`; p = r.e; }
  return out + esc(text.slice(p));
}

    <div class="two">
      <div class="panel"><h3 style="margin-bottom:10px">Güçlü yanlar</h3><ul class="clean">${(a.strengths_tr||[]).map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>
      <div class="panel"><h3 style="margin-bottom:10px">Nasıl daha iyi konuşursun</h3><ul class="clean">${(a.tips_tr||[]).map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>
    </div>
    ${a.model_answer?`<div class="panel"><h3 style="margin-bottom:8px">Örnek cevap</h3><p style="white-space:pre-wrap">${esc(a.model_answer)}</p><div class="row" style="margin-top:10px"><button class="btn small" id="speakModel">Sesli dinle</button></div></div>`:''}`;
  }
  return `<div class="wrap" style="gap:16px">
    <div class="panel" style="display:flex;flex-direction:column;gap:12px">
      <div class="row" style="justify-content:space-between"><div><div class="eyebrow">${m.tag} · ${new Date(rec.startedAt).toLocaleString('tr-TR',{day:'numeric',month:'long',hour:'2-digit',minute:'2-digit'})}</div><h2 style="margin-top:4px">${esc(rec.title)}</h2></div>
      <div class="row"><button class="btn" data-go2="home">Ana sayfa</button><button class="btn primary" id="again">Aynı modda yeni konuşma</button></div></div>
      ${kv}
    </div>
    ${analysis}
    <div class="panel"><div class="row" style="justify-content:space-between;margin-bottom:12px"><h3>Transkript</h3><span class="row" style="gap:12px;font-size:.8rem"><span><mark class="err">hata</mark></span><span><mark class="up">yükseltilebilir</mark></span></span></div><div class="transcript">${lines}</div></div>
    <div class="row" style="justify-content:flex-end"><button class="btn small danger" id="delBtn">Bu konuşmayı sil</button><span id="delConfirm" hidden class="row"><span class="muted" style="font-size:.85rem">Silinsin mi? Zincirdeki dakikalar da düşer.</span><button class="btn small danger" id="delYes">Sil</button><button class="btn small" id="delNo">Vazgeç</button></span></div>
  </div>`;
}

// retry an error by saying it again
const retry = { idx:null };
function updateRetryLive(){ if(retry.idx==null) return; const el = $('#ro'+retry.idx); if(el){ el.hidden = false; el.textContent = '🎙 ' + srLive(); } }
function retryToggle(idx, btn){
  const out = $('#ro'+idx);
  if(!canMic){ out.hidden = false; out.innerHTML = `<div class="typed"><input type="text" id="rt${idx}" placeholder="Düzeltilmiş cümleyi yaz"><button class="btn small" data-check="${idx}">Kontrol et</button></div>`; return; }
  if(retry.idx === idx && dict.target === 'retry'){ finishRetry(btn); return; }
  if(dict.active){ toast('Önce diğer kaydı bitir.'); return; }
  retry.idx = idx; btn.textContent = 'Bitir';
  out.hidden = false; out.textContent = 'Dinliyorum… Cümleyi düzeltilmiş haliyle söyle.';
  if(!srStart('retry')){ retry.idx = null; btn.textContent = 'Doğrusunu söyle'; out.hidden = true; }
}
async function finishRetry(btn){
  const idx = retry.idx; if(idx == null) return;
  retry.idx = null; if(btn) btn.textContent = 'Doğrusunu söyle';
  if(dict.active) await srStop();
  const said = srText(); dict.target = null; dict.base = '';
  const rec = state.sessions.find(s=>s.id===state.reportId);
  checkRetry(rec.analysis.errors[idx], said, $('#ro'+idx));
}
async function checkRetry(e, said, out){
  if(!out) return;
  if(!said){ out.textContent = 'Bir şey duyulmadı.'; return; }
  out.innerHTML = '<span class="spinner"></span>';
  try{
    const r = await askJSON(`A learner made this error: "${e.original}" (correct form: "${e.correction}"; reason: ${e.explanation_tr}). They now said (speech-to-text, ignore punctuation): "${said}". Did they fix this specific error? Reply with only JSON: {"fixed":true|false,"feedback_tr":"one short sentence in Turkish"}`, {quick:true, max_tokens:512});
    out.innerHTML = `<b style="color:${r.fixed?'var(--ok)':'var(--danger)'}">${r.fixed?'Doğru':'Henüz değil'}</b> · “${esc(said)}”<br>${esc(r.feedback_tr||'')}`;
  }catch(err){ out.textContent = apiErr(err); }
}

// ---------- backup ----------
function exportBackup(){
  const data = JSON.stringify({app:'speak-chain', version:1, exportedAt:new Date().toISOString(), sessions:state.sessions, settings:{...state.settings, apiKey:''}}, null, 1);
  const blob = new Blob([data], {type:'application/json'}), url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = 'speak-chain-yedek-' + dayKey() + '.json'; document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 10000);
}
function importBackup(file){
  const fr = new FileReader();
  fr.onload = () => {
    try{
      const d = JSON.parse(fr.result); if(!d || !Array.isArray(d.sessions)) throw 0;
      const byId = new Map(state.sessions.map(s => [s.id, s])); let added = 0;
      for(const s of d.sessions){ if(s && s.id && s.day && !byId.has(s.id)){ byId.set(s.id, s); added++; } }
      state.sessions = [...byId.values()].sort((a,b)=>b.startedAt-a.startedAt);
      if(d.settings && d.settings.goalMin) state.settings.goalMin = d.settings.goalMin;
      persist(); toast(added + ' konuşma geri yüklendi.'); render();
    }catch{ toast('Bu dosya bir Speak Chain yedeği değil.'); }
  };
  fr.readAsText(file);
}

// ---------- events ----------
document.addEventListener('click', e => {
  const t = e.target;
  const g2 = t.closest('[data-go2]'); if(g2){ go(g2.dataset.go2); return; }
  const md = t.closest('[data-mode]'); if(md){ openSetup(md.dataset.mode); return; }
  const gl = t.closest('[data-goal]'); if(gl){ state.settings.goalMin = +gl.dataset.goal; saveSettings(); render(); return; }
  const op = t.closest('[data-open]'); if(op){ state.reportId = op.dataset.open; state.analysisError = null; go('report'); return; }
  const grp = t.closest('[data-group] [data-val]');
  if(grp && state.view === 'setup'){
    const g = grp.closest('[data-group]').dataset.group, v = grp.dataset.val;
    const r = $('#roleIn'); if(r) state.setup.role = r.value;
    const ci = $('#conceptIn'); if(ci && g !== 'concept') state.setup.custom = ci.value;
    const mi = $('#motionIn'); if(mi && g !== 'motion') state.setup.motion = mi.value;
    if(g === 'concept'){ state.setup.concept = v; state.setup.custom = ''; } else state.setup[g] = v;
    render(); return;
  }
  if(t.closest('#focusBtn')){ openSetup('free', {focus:true}); return; }
  if(t.closest('#startBtn')){
    unlockTTS();
    readSetupInputs(); newSession(); go('session');
    clearInterval(clockTimer); clockTimer = setInterval(()=>{ const c = $('#clock'); if(c && state.sess) c.textContent = fmtTime((Date.now()-state.sess.startedAt)/1000); }, 1000);
    if(MODES[state.sess.mode].kind === 'itep') prepareItep(); else aiTurn();
    return;
  }
  if(t.closest('#micBtn')){
    const S = state.sess; if(!S) return;
    if(dict.target === 'chat' && dict.active){ sendAnswer(); return; }
    if(S.busy) return;
    const resume = dict.target === 'chat' && !!srText();
    if(!resume) S.live = '';
    srStart('chat', resume);
    return;
  }
  if(t.closest('#micReopen')){ if(state.sess && state.sess.itep && state.sess.itep.phase === 'speak'){ dict.target = 'itep-speak'; srStart('itep-speak', true); } return; }
  if(t.closest('#kbOn') || t.closest('#kbOff')){ state.settings.kbDictation = !!t.closest('#kbOn'); dict.fails = 0; saveSettings(); renderSession(); if(state.settings.kbDictation){ const ta = $('#typedIn'); ta && ta.focus(); } return; }
  if(t.closest('#replayBtn')){ const S = state.sess; const last = S && [...S.turns].reverse().find(x => x.role === 'ai'); if(last) speak(last.text, true); return; }
  if(t.closest('#sendTyped')){ sendTyped(); return; }
  if(t.closest('#endBtn')){ endSession(); return; }
  if(t.closest('#itepGo')){ itepStart(); return; }
  if(t.closest('#itepRetryQ')){ prepareItep(); return; }
  if(t.closest('#itepSkip')){ itepSkipPrep(); return; }
  if(t.closest('#itepDone')){ itepEndSpeak(); return; }
  if(t.closest('#again')){ const rec = state.sessions.find(s=>s.id===state.reportId); openSetup(rec.mode, Object.fromEntries(Object.entries(rec.cfg||{}).filter(([k,v])=>v!=null))); return; }
  if(t.closest('#reAnalyze')){ const rec = state.sessions.find(s=>s.id===state.reportId); state.analyzing = rec.id; state.analysisError = null; render(); analyze(rec); return; }
  if(t.closest('#speakModel')){ const rec = state.sessions.find(s=>s.id===state.reportId); speak(rec.analysis.model_answer, true); return; }
  const rt = t.closest('[data-retry]'); if(rt){ retryToggle(+rt.dataset.retry, rt); return; }
  const ck = t.closest('[data-check]'); if(ck){ const i = +ck.dataset.check, rec = state.sessions.find(s=>s.id===state.reportId); checkRetry(rec.analysis.errors[i], ($('#rt'+i)?.value||'').trim(), $('#ro'+i)); return; }
  if(t.closest('#delBtn')){ $('#delBtn').hidden = true; $('#delConfirm').hidden = false; return; }
  if(t.closest('#delNo')){ $('#delBtn').hidden = false; $('#delConfirm').hidden = true; return; }
  if(t.closest('#delYes')){ deleteSession(state.reportId); go('home'); toast('Konuşma silindi.'); return; }
  // settings
  if(t.closest('#keyToggle')){ const k = $('#keyIn'); k.type = k.type === 'password' ? 'text' : 'password'; t.closest('#keyToggle').textContent = k.type === 'password' ? 'Göster' : 'Gizle'; return; }
  if(t.closest('#keySave')){
    state.settings.apiKey = $('#keyIn').value.trim();
    state.settings.model = $('#modelIn').value.trim().replace(/^models\//,'') || DEFAULTS.model;
    state.settings.quickModel = $('#qmodelIn').value.trim().replace(/^models\//,'') || DEFAULTS.quickModel;
    saveSettings(); renderNotes();
    const st = $('#keyStatus'); st.className = ''; st.innerHTML = '<span class="spinner"></span>';
    (async () => {
      const step = (txt) => { const s2 = $('#keyStatus'); if(s2) s2.innerHTML = '<span class="spinner"></span> ' + esc(txt); };
      step('Anahtar kontrol ediliyor…');
      let avail;
      try{ avail = await listModels(); }catch(e){ e.step = 'Anahtar kontrolü'; throw e; }
      state.models = avail; state.settings.models = avail;
      const usable = avail.filter(m => !/image|tts|audio|live|embed|native|robotics|computer/i.test(m));
      const order = (cur, pref) => [...new Set([cur, ...pref, ...usable.filter(m => /flash/i.test(m)), ...usable])].filter(m => avail.includes(m));
      const tryList = async (list, label) => {
        let lastErr = {code:'http', status:404, message:'Hesapta uygun model yok'};
        for(const md of list.slice(0, 5)){
          step(label + ': ' + md + ' deneniyor…');
          try{ await callModel(md, {messages:[{role:'user',content:'Reply with OK.'}], max_tokens:256, think:'minimal'}); return md; }
          catch(e){ lastErr = e; if(!(isTransient(e) || (e.code === 'http' && [404, 429, 403].includes(e.status)))) break; }
        }
        lastErr.step = label; throw lastErr;
      };
      const main = await tryList(order(state.settings.model, MAIN_PREF), 'Konuşma modeli');
      const quickList = order(state.settings.quickModel, QUICK_PREF);
      const quick = quickList.length ? await tryList(quickList, 'Hızlı model').catch(() => main) : main;
      state.settings.model = main; state.settings.quickModel = quick; saveSettings();
      for(const k in modelSwap) delete modelSwap[k];
      return {main, quick};
    })()
      .then(({main, quick}) => { render(); const s2 = $('#keyStatus'); s2.className = 'ok-txt'; s2.textContent = 'Bağlantı çalışıyor. Konuşma: ' + main + ', hızlı işler: ' + quick + '.'; })
      .catch(err => { const s2 = $('#keyStatus'); s2.className = 'bad-txt'; s2.textContent = (err.step ? err.step + ' başarısız. ' : '') + apiErr(err); });
    return;
  }
  if(t.closest('#voiceTest') || t.closest('#diagTts')){ diag('Ses testi: ' + (voices.length) + ' İngilizce ses, seçili: ' + (pickVoice()?.name || 'varsayılan')); speak('Hi! This is how I will sound during our practice sessions.', true); return; }
  if(t.closest('#diagMic')){
    if(dict.active && dict.target === 'diag'){ srStop().then(() => { diag('Test bitti. Duyulan: ' + (srText() || '(hiçbir şey)')); dict.target = null; diagMicUI(); }); return; }
    if(dict.active){ toast('Önce diğer kaydı bitir.'); return; }
    $('#diagLive').textContent = 'Dinliyorum… İngilizce bir cümle söyle.';
    srStart('diag'); diagMicUI(); return;
  }
  if(t.closest('#diagSpeed')){
    diag('Hız testi: ' + state.settings.model);
    callAI({messages:[{role:'user', content:'Say one short friendly sentence.'}], max_tokens:200, think:'minimal'}).then(x => diag('Cevap: ' + x.trim().slice(0, 80))).catch(e => diag(apiErr(e)));
    return;
  }
  if(t.closest('#exportBtn')){ exportBackup(); return; }
  if(t.closest('#wipeBtn')){ $('#wipeBtn').hidden = true; $('#wipeConfirm').hidden = false; return; }
  if(t.closest('#wipeNo')){ $('#wipeBtn').hidden = false; $('#wipeConfirm').hidden = true; return; }
  if(t.closest('#wipeYes')){ state.sessions = []; persist(); toast('Tüm konuşmalar silindi.'); go('home'); return; }
});
document.addEventListener('change', e => {
  const id = e.target.id;
  if(id === 'voiceSel'){ state.settings.voiceURI = e.target.value; saveSettings(); }
  else if(id === 'ttsT2'){ state.settings.tts = e.target.checked; saveSettings(); }
  else if(id === 'kbT'){ state.settings.kbDictation = e.target.checked; saveSettings(); }
  else if(id === 'importIn' && e.target.files[0]){ importBackup(e.target.files[0]); e.target.value = ''; }
});
document.addEventListener('input', e => {
  if(e.target.id === 'typedIn' && state.sess){ state.sess.typedDraft = e.target.value; if(!state.sess.typeStart && e.target.value) state.sess.typeStart = Date.now(); }
  if(e.target.id === 'rateIn'){ state.settings.rate = +e.target.value; $('#rateVal').textContent = state.settings.rate.toFixed(2) + '×'; saveSettings(); }
});
document.addEventListener('keydown', e => {
  if(e.target.id === 'typedIn' && e.key === 'Enter' && !e.shiftKey && state.sess && MODES[state.sess.mode].kind === 'chat'){ e.preventDefault(); sendTyped(); }
});
// refresh the chain when the app comes back to the foreground on a new day
document.addEventListener('visibilitychange', () => { if(!document.hidden && state.view === 'home') render(); });

load(); render();
if(!hasKey()) go('settings');
if('serviceWorker' in navigator && location.protocol === 'https:'){ navigator.serviceWorker.register('sw.js').catch(()=>{}); }
})();
</script>
